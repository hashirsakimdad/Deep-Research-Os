<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d"><title id="t">How Deep Research OS works</title><desc id="d">Question goes to Planner, then parallel Researchers store evidence in Postgres, Verifier grades claims, Contradiction Detector finds conflicts, Synthesizer drafts, Critic loops back up to twice, then a cited report.</desc><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#d9cdb4"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2b2a26"/></marker>
<marker id="arl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9622b"/></marker></defs><rect width="1200" height="600" rx="24" fill="#f8f2e4"/><rect width="1200" height="600" rx="24" fill="url(#dots)" opacity=".55"/><rect x="1.5" y="1.5" width="1197" height="597" rx="23" fill="none" stroke="#2b2a26" stroke-width="3"/><text x="48" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#2b2a26">How it works</text><text x="1152" y="56" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#d9622b" text-anchor="end">2 rounds max</text><path d="M216.0 150L240.0 150" stroke="#2b2a26" stroke-width="3" marker-end="url(#ar)"/><path d="M436.0 150L470.0 150" stroke="#2b2a26" stroke-width="3" marker-end="url(#ar)"/><path d="M666.0 150L700.0 150" stroke="#2b2a26" stroke-width="3" marker-end="url(#ar)"/><path d="M896.0 150L950.0 150" stroke="#2b2a26" stroke-width="3" marker-end="url(#ar)"/><path d="M1050 194.0L1050 340.0" stroke="#2b2a26" stroke-width="3" marker-end="url(#ar)"/><path d="M954.0 390L894.0 390" stroke="#2b2a26" stroke-width="3" marker-end="url(#ar)"/><path d="M704.0 390L664.0 390" stroke="#2b2a26" stroke-width="3" marker-end="url(#ar)"/><path d="M474.0 390L394.0 390" stroke="#2b2a26" stroke-width="3" marker-end="url(#ar)"/><path d="M530 346.0 C 470 270, 470 270, 530 200.0" stroke="#7a7263" stroke-width="3" fill="none" stroke-dasharray="8 7" marker-end="url(#arl)"/><text x="440" y="262" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#7a7263" text-anchor="end" font-weight="700">gaps? research again</text><text x="440" y="286" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#7a7263" text-anchor="end">(max 2 rounds)</text><rect x="36.0" y="120.0" width="180" height="72" rx="14" fill="#2b2a26"/><rect x="30.0" y="114.0" width="180" height="72" rx="14" fill="#2b2a26" stroke="#2b2a26" stroke-width="3"/><text x="120" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#fffaf0" text-anchor="middle">Question</text><text x="120" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#fffaf0" text-anchor="middle" opacity=".85">you ask</text><rect x="256.0" y="120.0" width="180" height="72" rx="14" fill="#2b2a26"/><rect x="250.0" y="114.0" width="180" height="72" rx="14" fill="#2f7f73" stroke="#2b2a26" stroke-width="3"/><text x="340" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#fffaf0" text-anchor="middle">Planner</text><text x="340" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#fffaf0" text-anchor="middle" opacity=".85">splits it up</text><rect x="492.0" y="102.0" width="180" height="72" rx="14" fill="#fffaf0" stroke="#2b2a26" stroke-width="2.5"/><rect x="486.0" y="108.0" width="180" height="72" rx="14" fill="#fffaf0" stroke="#2b2a26" stroke-width="2.5"/><rect x="486.0" y="120.0" width="180" height="72" rx="14" fill="#2b2a26"/><rect x="480.0" y="114.0" width="180" height="72" rx="14" fill="#3b6fb6" stroke="#2b2a26" stroke-width="3"/><text x="570" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#fffaf0" text-anchor="middle">Researchers</text><text x="570" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#fffaf0" text-anchor="middle" opacity=".85">×3 in parallel</text><g><ellipse cx="806" cy="182" rx="90.0" ry="14" fill="#2b2a26"/><rect x="716.0" y="120.0" width="180" height="58" fill="#2b2a26"/><path d="M710.0 122.0 v56 a90.0 14 0 0 0 180 0 v-56" fill="#d69a1f" stroke="#2b2a26" stroke-width="3"/><ellipse cx="800" cy="122.0" rx="90.0" ry="14" fill="#d69a1f" stroke="#2b2a26" stroke-width="3"/></g><text x="800" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#fffaf0" text-anchor="middle">Evidence</text><text x="800" y="184" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#fffaf0" text-anchor="middle" opacity=".85">Postgres</text><rect x="966.0" y="120.0" width="180" height="72" rx="14" fill="#2b2a26"/><rect x="960.0" y="114.0" width="180" height="72" rx="14" fill="#4f8a3a" stroke="#2b2a26" stroke-width="3"/><text x="1050" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#fffaf0" text-anchor="middle">Verifier</text><text x="1050" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#fffaf0" text-anchor="middle" opacity=".85">grades claims</text><rect x="966.0" y="360.0" width="180" height="72" rx="14" fill="#2b2a26"/><rect x="960.0" y="354.0" width="180" height="72" rx="14" fill="#d9622b" stroke="#2b2a26" stroke-width="3"/><text x="1050" y="388" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#fffaf0" text-anchor="middle">Contradiction</text><text x="1050" y="412" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#fffaf0" text-anchor="middle" opacity=".85">finds conflicts</text><rect x="716.0" y="360.0" width="180" height="72" rx="14" fill="#2b2a26"/><rect x="710.0" y="354.0" width="180" height="72" rx="14" fill="#d69a1f" stroke="#2b2a26" stroke-width="3"/><text x="800" y="388" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#fffaf0" text-anchor="middle">Synthesizer</text><text x="800" y="412" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#fffaf0" text-anchor="middle" opacity=".85">drafts report</text><rect x="486.0" y="360.0" width="180" height="72" rx="14" fill="#2b2a26"/><rect x="480.0" y="354.0" width="180" height="72" rx="14" fill="#2b2a26" stroke="#2b2a26" stroke-width="3"/><text x="570" y="388" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#fffaf0" text-anchor="middle">Critic</text><text x="570" y="412" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#fffaf0" text-anchor="middle" opacity=".85">finds gaps</text><rect x="216.0" y="360.0" width="180" height="72" rx="14" fill="#2b2a26"/><rect x="210.0" y="354.0" width="180" height="72" rx="14" fill="#d9622b" stroke="#2b2a26" stroke-width="3"/><text x="300" y="388" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#fffaf0" text-anchor="middle">Cited report</text><text x="300" y="412" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#fffaf0" text-anchor="middle" opacity=".85">claim → URL</text><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#7a7263"><circle cx="66" cy="540" r="10" fill="#d9622b" stroke="#2b2a26" stroke-width="2.5"/><text x="86" y="547">your question moving through the pipeline</text><text x="1152" y="547" text-anchor="end">Rust runs the workflow · Grok does the thinking</text></g><g transform="translate(384.0 350.0)"><circle r="16" fill="#4f8a3a" stroke="#2b2a26" stroke-width="3"/><path d="M-7 0l5 5 9-10" stroke="#fffaf0" stroke-width="3.5" fill="none" stroke-linecap="round"/></g></svg