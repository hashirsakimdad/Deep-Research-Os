<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d"><title id="t">Deep Research OS — autonomous multi-agent deep research engine in Rust</title><desc id="d">Every statement in the report traces back through claim, evidence, source and URL.</desc><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#d9cdb4"/></pattern>
