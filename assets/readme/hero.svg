<marker id="arl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9622b"/></marker></defs><rect width="1200" height="420" rx="24" fill="#f8f2e4"/><rect width="1200" height="420" rx="24" fill="url(#dots)" opacity=".55"/><rect x="1.5" y="1.5" width="1197" height="417" rx="23" fill="none" stroke="#2b2a26" stroke-width="3"/><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><text x="64" y="88" fill="#d9622b" font-size="20" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="2" font-weight="700">$ research --cite-everything</text><text x="62" y="166" fill="#2b2a26" font-size="70" font-weight="800">Deep Research <tspan fill="#d9622b">OS</tspan></text><path d="M64 182 Q 300 172 560 184" stroke="#d69a1f" stroke-width="6" fill="none" stroke-linecap="round"/><text x="64" y="226" fill="#7a7263" font-size="25">Ask a hard question. Six AI agents plan, research, verify,</text><text x="64" y="259" fill="#7a7263" font-size="25">find contradictions, write and critique a fully cited report.</text></g><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" font-weight="700"><rect x="70" y="306" width="128" height="52" rx="14" fill="#2b2a26"/><rect x="64" y="300" width="128" height="52" rx="14" fill="#fffaf0" stroke="#4f8a3a" stroke-width="3"/><text x="128.0" y="333" fill="#4f8a3a" text-anchor="middle">claim</text><path d="M202 326h28" stroke="#2b2a26" stroke-width="3" marker-end="url(#ar)"/><rect x="244" y="306" width="160" height="52" rx="14" fill="#2b2a26"/><rect x="238" y="300" width="160" height="52" rx="14" fill="#fffaf0" stroke="#d69a1f" stroke-width="3"/><text x="318.0" y="333" fill="#d69a1f" text-anchor="middle">evidence</text><path d="M408 326h28" stroke="#2b2a26" stroke-width="3" marker-end="url(#ar)"/><rect x="450" y="306" width="140" height="52" rx="14" fill="#2b2a26"/><rect x="444" y="300" width="140" height="52" rx="14" fill="#fffaf0" stroke="#3b6fb6" stroke-width="3"/><text x="514.0" y="333" fill="#3b6fb6" text-anchor="middle">source</text><path d="M594 326h28" stroke="#2b2a26" stroke-width="3" marker-end="url(#ar)"/><rect x="636" y="306" width="100" height="52" rx="14" fill="#2b2a26"/><rect x="630" y="300" width="100" height="52" rx="14" fill="#fffaf0" stroke="#2f7f73" stroke-width="3"/><text x="680.0" y="333" fill="#2f7f73" text-anchor="middle">URL</text></g><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" font-weight="700"><circle cx="905" cy="212" r="150" fill="none" stroke="#2b2a26" stroke-width="2.5" stroke-dasharray="4 10" stroke-linecap="round"/><rect x="859" y="184" width="104" height="68" rx="14" fill="#2b2a26"/><rect x="853" y="178" width="104" height="68" rx="14" fill="#d9622b" stroke="#2b2a26" stroke-width="3"/><text x="905" y="219" fill="#fffaf0" text-anchor="middle" font-size="22">Rust</text><circle cx="905.0" cy="62.0" r="13" fill="#2f7f73" stroke="#2b2a26" stroke-width="2.5"/><text x="905.0" y="38.0" fill="#2b2a26" text-anchor="middle">Planner</text><circle cx="1034.9" cy="137.0" r="13" fill="#3b6fb6" stroke="#2b2a26" stroke-width="2.5"/><text x="1056.9" y="144.0" fill="#2b2a26" text-anchor="start">Researcher</text><circle cx="1034.9" cy="287.0" r="13" fill="#4f8a3a" stroke="#2b2a26" stroke-width="2.5"/><text x="1056.9" y="294.0" fill="#2b2a26" text-anchor="start">Verifier</text><circle cx="905.0" cy="362.0" r="13" fill="#d69a1f" stroke="#2b2a26" stroke-width="2.5"/><text x="905.0" y="398.0" fill="#2b2a26" text-anchor="middle">Synthesizer</text><circle cx="775.1" cy="287.0" r="13" fill="#d9622b" stroke="#2b2a26" stroke-width="2.5"/><text x="753.1" y="294.0" fill="#2b2a26" text-anchor="end">Contradiction</text><circle cx="775.1" cy="137.0" r="13" fill="#2b2a26" stroke="#2b2a26" stroke-width="2.5"/><text x="753.1" y="144.0" fill="#2b2a26" text-anchor="end">Critic</text></g></svg>